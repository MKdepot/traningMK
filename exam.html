<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>แบบทดสอบ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#00a94f; --green-dark:#00863f; --red:#e3242b; --amber:#f5a623;
  --ink:#1a1a1a; --muted:#5c5c5c; --line:#d4d4d4; --bg:#f4f6f8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Sarabun',sans-serif;font-size:20px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:16px 18px 40px}

/* ---- แถบความคืบหน้า ---- */
.bar{background:#fff;padding:16px 18px;box-shadow:0 2px 8px rgba(0,0,0,.06);
  position:sticky;top:0;z-index:10}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;
  max-width:560px;margin:0 auto 10px}
.bar-title{font-size:19px;font-weight:600}
.bar-count{font-size:22px;font-weight:700;color:var(--green)}
.track{max-width:560px;margin:0 auto;height:14px;background:#e6e6e6;
  border-radius:8px;overflow:hidden}
.fill{height:100%;background:var(--green);border-radius:8px;
  transition:width .35s ease;width:0}

/* ---- คำถาม ---- */
.qbox{background:#fff;border-radius:18px;padding:28px 24px;margin:20px 0;
  box-shadow:0 2px 12px rgba(0,0,0,.07)}
.qnum{display:inline-block;background:#eef7f1;color:var(--green-dark);
  font-size:18px;font-weight:700;padding:5px 16px;border-radius:20px;margin-bottom:16px}
.qtext{font-size:25px;font-weight:600;line-height:1.55}
.qimg{width:100%;border-radius:12px;margin-top:16px}

/* ---- ตัวเลือก ---- */
.choice{display:flex;align-items:center;gap:16px;width:100%;
  background:#fff;border:3px solid var(--line);border-radius:16px;
  padding:22px 20px;margin-bottom:14px;font-family:inherit;
  font-size:24px;font-weight:600;text-align:right;cursor:pointer;color:var(--ink)}
.choice .mark{flex:none;width:36px;height:36px;border-radius:50%;
  border:3px solid var(--line);display:flex;align-items:center;
  justify-content:center;font-size:20px;color:transparent}
.choice.sel{border-color:var(--green);background:#f0fff6}
.choice.sel .mark{background:var(--green);border-color:var(--green);color:#fff}
.choice:disabled{opacity:.5}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;height:72px;border:none;border-radius:14px;font-family:inherit;
  font-size:24px;font-weight:700;cursor:pointer;background:var(--green);
  color:#fff;margin-top:8px;text-decoration:none}
.btn:active{background:var(--green-dark)}
.btn:disabled{background:#c4c4c4;cursor:default}
.btn-ghost{background:#fff;color:var(--muted);border:2px solid var(--line);font-weight:600}

.note{text-align:center;color:var(--muted);font-size:17px;margin-top:14px}
.msg{border-radius:12px;padding:16px 18px;font-size:19px;margin-bottom:16px;display:none}
.msg.error{display:block;background:#ffeceb;color:#a3161c;border:1px solid #f5b5b3}

/* ---- หน้าเริ่ม / ผลสอบ ---- */
.center{text-align:center}
.panel{background:#fff;border-radius:18px;padding:34px 24px;margin-top:20px;
  box-shadow:0 2px 12px rgba(0,0,0,.07);text-align:center}
.panel h2{font-size:26px;margin:0 0 8px}
.panel p{color:var(--muted);font-size:19px;margin:0 0 6px}
.big-score{font-size:72px;font-weight:700;line-height:1.1;margin:18px 0 4px}
.verdict{font-size:26px;font-weight:700;margin-bottom:8px}
.pass{color:var(--green)} .fail{color:var(--red)}
.icon{font-size:64px;line-height:1;margin-bottom:10px}

.loading{text-align:center;padding:80px 20px;color:var(--muted)}
.spin{display:inline-block;width:40px;height:40px;border:4px solid #ddd;
  border-top-color:var(--green);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none}
</style>
</head>
<body>

<div id="bar" class="bar hide">
  <div class="bar-top">
    <span class="bar-title" id="barTitle">แบบทดสอบ</span>
    <span class="bar-count" id="barCount">-</span>
  </div>
  <div class="track"><div class="fill" id="barFill"></div></div>
</div>

<div class="wrap">
  <div id="msg" class="msg"></div>

  <div id="loading" class="loading"><div class="spin"></div><p>กำลังโหลด...</p></div>

  <!-- ---- หน้าเริ่ม ---- -->
  <div id="intro" class="panel hide">
    <div class="icon">📝</div>
    <h2 id="introTitle">แบบทดสอบ</h2>
    <p id="introDesc"></p>
    <div style="background:#fffbe9;border:1px solid #f0ddaa;border-radius:12px;
                padding:18px;margin:22px 0;text-align:right;font-size:18px;line-height:1.8">
      • ข้อสอบจะขึ้นมา<b>ทีละข้อ</b><br>
      • ตอบแล้ว<b>ย้อนกลับมาแก้ไม่ได้</b><br>
      • ทำไม่ทันปิดไปก่อนได้ กลับมาทำต่อจากข้อเดิม
    </div>
    <button class="btn" id="btnStart">เริ่มทำข้อสอบ</button>
    <a class="btn btn-ghost" href="home.html">ย้อนกลับ</a>
  </div>

  <!-- ---- คำถาม ---- -->
  <div id="quiz" class="hide">
    <div class="qbox">
      <span class="qnum" id="qNum">ข้อ 1</span>
      <div class="qtext" id="qText"></div>
      <img id="qImg" class="qimg hide">
    </div>
    <div id="choices"></div>
    <button class="btn" id="btnConfirm" disabled>ยืนยันคำตอบ</button>
    <div class="note">เลือกคำตอบก่อน แล้วจึงกดยืนยัน</div>
  </div>

  <!-- ---- ผลสอบ ---- -->
  <div id="result" class="panel hide">
    <div class="icon" id="resIcon"></div>
    <div class="verdict" id="resVerdict"></div>
    <div class="big-score" id="resScore"></div>
    <p id="resDetail"></p>
    <div id="resNote" style="margin:20px 0;font-size:19px"></div>
    <a class="btn" id="resBtn" href="home.html">กลับหน้าหลัก</a>
  </div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// ===== ตั้งค่าให้ตรงกับ index.html =====
const SUPABASE_URL  = "https://xxxxxxxxxxxx.supabase.co";
const SUPABASE_ANON = "eyJhbGciOi...";
// ======================================

const sb = createClient(SUPABASE_URL, SUPABASE_ANON);
const $  = id => document.getElementById(id);
const show = (...ids) => ids.forEach(i => $(i).classList.remove('hide'));
const hide = (...ids) => ids.forEach(i => $(i).classList.add('hide'));

const examType = new URLSearchParams(location.search).get('type') === 'post' ? 'post' : 'pre';
const LABEL = examType === 'pre' ? 'แบบทดสอบก่อนอบรม' : 'แบบทดสอบหลังอบรม';

let attemptId = null;
let selected  = null;
let currentSeq = null;

function err(t){ const m=$('msg'); m.className='msg error'; m.textContent=t; window.scrollTo(0,0); }
function clearErr(){ $('msg').className='msg'; }

// ---- ต้องล็อกอินก่อน ----
const { data:{ session } } = await sb.auth.getSession();
if (!session) location.replace('index.html');

// ---- มีชุดที่ทำค้างอยู่ไหม ----
const { data: openAttempt } = await sb
  .from('exam_attempts')
  .select('id, exam_type, total_questions')
  .eq('status', 'in_progress')
  .eq('exam_type', examType)
  .maybeSingle();

hide('loading');

$('introTitle').textContent = LABEL;
$('introDesc').textContent  = examType === 'pre'
  ? 'วัดความรู้เดิมก่อนเข้าอบรม ไม่มีเกณฑ์ผ่าน ตอบตามที่เข้าใจได้เลย'
  : 'ต้องได้ 80% ขึ้นไปจึงจะผ่าน';

if (openAttempt) {
  // ทำค้างไว้ → ทำต่อเลย ไม่ต้องเริ่มใหม่
  attemptId = openAttempt.id;
  show('bar','quiz');
  $('barTitle').textContent = LABEL;
  await loadNext();
} else {
  show('intro');
}

// ---- เริ่มทำข้อสอบ ----
$('btnStart').addEventListener('click', async () => {
  clearErr();
  $('btnStart').disabled = true;
  $('btnStart').textContent = 'กำลังเตรียมข้อสอบ...';
  try {
    const { data, error } = await sb.rpc('start_attempt', { p_exam_type: examType });
    if (error) throw error;
    attemptId = data;
    hide('intro');
    show('bar','quiz');
    $('barTitle').textContent = LABEL;
    await loadNext();
  } catch (e) {
    err(e.message);
    $('btnStart').disabled = false;
    $('btnStart').textContent = 'เริ่มทำข้อสอบ';
  }
});

// ---- ขอข้อถัดไปจาก server ----
async function loadNext() {
  clearErr();
  const { data, error } = await sb.rpc('get_next_question', { p_attempt_id: attemptId });
  if (error) return err(error.message);

  if (data.finished) return await finish();

  currentSeq = data.seq;
  selected   = null;

  $('qNum').textContent  = `ข้อ ${data.seq}`;
  $('qText').textContent = data.question;
  $('barCount').textContent = `${data.seq} / ${data.total}`;
  $('barFill').style.width = `${(data.seq - 1) * 100 / data.total}%`;

  if (data.image_path) {
    $('qImg').src = data.image_path;
    show('qImg');
  } else hide('qImg');

  // ตัวเลือก — ลำดับสุ่มมาจาก server แล้ว
  $('choices').innerHTML = '';
  data.choices.forEach(c => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = `<span class="mark">✓</span><span style="flex:1">${c.text}</span>`;
    b.onclick = () => {
      selected = c.id;
      [...$('choices').children].forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      $('btnConfirm').disabled = false;
    };
    $('choices').appendChild(b);
  });

  $('btnConfirm').disabled = true;
  $('btnConfirm').textContent = 'ยืนยันคำตอบ';
  window.scrollTo(0, 0);
}

// ---- ส่งคำตอบ (ตรวจฝั่ง server ไม่บอกผลรายข้อ) ----
$('btnConfirm').addEventListener('click', async () => {
  if (!selected) return;
  $('btnConfirm').disabled = true;
  $('btnConfirm').textContent = 'กำลังบันทึก...';
  [...$('choices').children].forEach(x => x.disabled = true);

  try {
    const { error } = await sb.rpc('submit_answer', {
      p_attempt_id: attemptId,
      p_seq:        currentSeq,
      p_choice_id:  selected,
    });
    if (error) throw error;
    await loadNext();
  } catch (e) {
    err(e.message);
    $('btnConfirm').disabled = false;
    $('btnConfirm').textContent = 'ยืนยันคำตอบ';
    [...$('choices').children].forEach(x => x.disabled = false);
  }
});

// ---- ส่งข้อสอบ + แสดงผล ----
async function finish() {
  const { data, error } = await sb.rpc('finish_attempt', { p_attempt_id: attemptId });
  if (error) return err(error.message);

  hide('bar','quiz');
  show('result');
  $('barFill').style.width = '100%';

  $('resScore').textContent  = Math.round(data.score) + '%';
  $('resDetail').textContent = `ตอบถูก ${data.correct} ข้อ จากทั้งหมด ${data.total} ข้อ`;

  if (examType === 'pre') {
    $('resIcon').textContent    = '✅';
    $('resVerdict').textContent = 'ทำข้อสอบเรียบร้อย';
    $('resVerdict').className   = 'verdict';
    $('resNote').innerHTML      = 'ขั้นตอนต่อไปคือ<b>ดูวิดีโออบรม</b>';
    $('resBtn').textContent     = 'ไปดูวิดีโออบรม';
    $('resBtn').href            = 'learning.html';

  } else if (data.passed) {
    $('resIcon').textContent    = '🎉';
    $('resVerdict').textContent = 'สอบผ่าน';
    $('resVerdict').className   = 'verdict pass';
    $('resNote').innerHTML      = 'ขั้นตอนต่อไปคือ<b>ส่งรูปถ่ายและเอกสาร</b>';
    $('resBtn').textContent     = 'ส่งเอกสาร';
    $('resBtn').href            = 'documents.html';

  } else {
    $('resIcon').textContent    = '📖';
    $('resVerdict').textContent = 'ยังไม่ผ่าน';
    $('resVerdict').className   = 'verdict fail';
    $('resNote').innerHTML =
      `ต้องได้ <b>${data.threshold}%</b> ขึ้นไป<br>` +
      `กรุณาดูวิดีโออบรมอีกครั้ง แล้วสอบใหม่ในวันถัดไป`;
    $('resBtn').textContent     = 'กลับหน้าหลัก';
    $('resBtn').href            = 'home.html';
  }
}

// ---- กันปิดหน้าระหว่างทำข้อสอบโดยไม่ตั้งใจ ----
window.addEventListener('beforeunload', e => {
  const doingExam = !$('quiz').classList.contains('hide');
  if (doingExam) { e.preventDefault(); e.returnValue = ''; }
});
</script>
</body>
</html>
